apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win11
spec:
  instancetype:
    #name: u1.large
    name: u1.2xmedium
  preference:
    name: windows.11.virtio
    kind: VirtualMachineClusterPreference
  runStrategy: Always
  template:
    metadata:
      labels:
        network.kubevirt.io/headlessService: headless
    spec:
      domain:
        devices:
          autoattachVSOCK: true
          autoattachPodInterface: false
          disks:
            - bootOrder: 1
              name: rootdisk
          interfaces:
            - masquerade: {}
              name: default
      networks:
        - name: default
          pod: {}
      subdomain: headless
      volumes:
        - persistentVolumeClaim:
            claimName: win11-boot-pvc-1
          name: rootdisk
        - name: cloudinitdisk
          cloudInitConfigDrive:       
            userData: |
              #ps1_sysnative

              $User = "root"
              $PubKey = "ssh-rsa  agilboa@redhat.com"

              # Create user
              net user $User /add
              net localgroup Administrators $User /add

              # Write authorized keys for admins
              $AuthKeys = "C:\ProgramData\ssh\administrators_authorized_keys"
              Set-Content -Path $AuthKeys -Value $PubKey

              # Fix permissions (THIS PART IS CRITICAL)
              icacls $AuthKeys /inheritance:r
              icacls $AuthKeys /grant "Administrators:F"
              icacls $AuthKeys /grant "SYSTEM:F"

              # Ensure key auth is enabled
              (Get-Content "C:\ProgramData\ssh\sshd_config") `
                -replace '#PasswordAuthentication no','PasswordAuthentication yes' `
                -replace '#PubkeyAuthentication yes','PubkeyAuthentication yes' | `
                Set-Content "C:\ProgramData\ssh\sshd_config"

              Restart-Service sshd
